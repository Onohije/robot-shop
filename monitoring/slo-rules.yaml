# SLO: 99% availability per focus service, measured by blackbox probes.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: robot-shop-slo
  namespace: monitoring
spec:
  groups:
    - name: robot-shop-slo
      rules:
        # SLI: share of successful probes over the last 5 minutes, per service
        - record: robotshop:availability:ratio_5m
          expr: avg by (service) (avg_over_time(probe_success{service=~"web|catalogue|cart|payment"}[5m]))

        - alert: RobotShopAvailabilityBelowSLO
          expr: robotshop:availability:ratio_5m < 0.99
          for: 2m
          labels:
            severity: critical
            slo: availability
          annotations:
            summary: "{{ $labels.service }} availability is {{ $value | humanizePercentage }} (SLO 99%)"
            description: "Probes to {{ $labels.service }} have been failing for over 2 minutes. The error budget is burning."
            runbook_url: "https://github.com/Onohije/robot-shop/blob/master/docs/runbook-availability.md"
